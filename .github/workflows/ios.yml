name: iOS

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*-ios"]

# Mínimo privilegio: el token solo lee. El job "release" eleva a contents: write.
permissions:
  contents: read

# Un solo build por ref; no se cancela uno en curso para no dejar un release a medias.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

# Acciones de terceros fijadas a SHA completo (el comentario indica la versión).
# Dependabot (.github/dependabot.yml) propone las actualizaciones.

jobs:
  # Solo se publica un tag que apunte a un commit de main y cuya versión coincida con la app.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag sobre main y versión consistente
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::El tag $TAG no apunta a un commit de main"; exit 1; }
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "v$app-ios" = "$TAG" ] \
            || { echo "::error::El tag $TAG no coincide con la versión de tauri.conf.json (v$app-ios)"; exit 1; }

  build:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versión de la app
        id: version
        run: |
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$app" >> "$GITHUB_OUTPUT"

      # Xcode 16 o superior: requerido por el target iOS 16+ y por los SDK de iOS actuales.
      - name: Verificar Xcode
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')
          [ "$major" -ge 16 ] || { echo "::error::Se requiere Xcode 16 o superior (detectado: $major)"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      # --ignore-scripts: ningún paquete npm ejecuta código al instalarse (mismo criterio que build.yml).
      - run: npm ci --ignore-scripts

      # Simulador: .app para arm64 simulador, empaquetada en zip para descargar.
      - name: Compilar para simulador (debug)
        run: npx tauri ios build --target aarch64-sim --debug --ci

      - name: Empaquetar .app del simulador
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP=$(find src-tauri/gen/apple/build -type d -name '*.app' | grep -i 'sim' | head -1)
          [ -n "$APP" ] || { echo "::error::No se encontró el .app del simulador"; exit 1; }
          # Fuera de dist/: el build de dispositivo recompila el frontend y Vite vacía dist/.
          mkdir -p release-out
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-out/NetTerminal-v${VERSION}-ios-simulator.app.zip"

      # Dispositivo sin firma: xcodebuild directo no sirve (la fase de Tauri exige que el CLI esté corriendo).
      # Sin certificado de Apple, el .app sale sin firmar y se re-firma al instalarlo (AltStore, Sideloadly o Xcode).
      - name: Compilar para dispositivo (sin firma)
        run: npx tauri ios build --target aarch64 --no-sign --archive-only --ci

      - name: Empaquetar .ipa sin firma
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP=$(find src-tauri/gen/apple/build/net-terminal_iOS.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::No se encontró el .app de dispositivo"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry "../release-out/NetTerminal-v${VERSION}-ios-unsigned.ipa" Payload)

      # latest.json: lo consulta la app (Ajustes > Acerca de) para avisar de versiones nuevas.
      - name: Generar latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '{"version":"%s","notes":"","pub_date":"%s"}\n' "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release-out/latest.json
          cat release-out/latest.json

      - name: Generar SHA256SUMS
        run: |
          cd release-out
          shasum -a 256 *.zip *.ipa > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NetTerminal-v${{ steps.version.outputs.version }}-ios
          path: release-out/
          if-no-files-found: error

  # Al publicar un tag v*-ios crea el Release con el .app de simulador y el .ipa sin firma.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NetTerminal-v*-ios
          merge-multiple: true
          path: release-out

      - name: Crear release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: NetTerminal iOS ${{ github.ref_name }}
          body: |
            Build iOS sin firma de Apple.
            - Simulador: descomprimir el .zip y arrastrar el .app al simulador de Xcode.
            - Dispositivo: instalar el .ipa con AltStore, Sideloadly o Xcode (ver IOS.md).
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-out/*.zip
            release-out/*.ipa
            release-out/SHA256SUMS
            release-out/latest.json
